org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- GT Push ---
# App ID of the Android app in AppGallery Connect (Project settings > App information > App ID).
# Wear Engine rejects calls ("Scope unauthorized") until this is set and Wear Engine access is approved.
gtpush.huaweiAppId=
# Bundle name of the watch app (watch/entry/src/main/config.json).
gtpush.watchPackage=com.datnt.gtpush.watch
# <bundleName>_<base64 EC public key of the key that signs the watch HAP> (key: ../signing/watch-debug.p12).
gtpush.watchFingerprint=com.datnt.gtpush.watch_BDlw6bo5mbMbYHUwJjohHUnwLQp7ieg35eOad0mP8P4GdX1zZ8y/NyWzS9ESTfrCEGw3hmJRjGamjvWnnMCOMlk=
# Port of the local HTTP endpoint the Mac pushes to (adb forward tcp:8765 tcp:8765).
gtpush.httpPort=8765
